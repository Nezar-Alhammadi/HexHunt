[package]
name = "hexhunt-bench"
version = "0.1.0"
description = "Independent evaluation harness for HexHunt Recon"
authors = ["HexHunt"]
edition = "2021"

[lib]
name = "hexhunt_bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hexhunt_core = { package = "hexhunt", path = "../../HexHunt/src-tauri" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
